<svg xmlns="http://www.w3.org/2000/svg" width="900" height="260" viewBox="0 0 900 260" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <style>
      .bg { fill: #0d1117; }
      .mono { font-family: 'Fira Code','Consolas','Courier New',monospace; font-size: 16px; }
      .prompt { fill: #00c6ff; }
      .cmd { fill: #b366ff; font-weight: bold; }
      .out { fill: #e6f2ff; }
      .arrow { fill: #7b9bff; }
    </style>
  </defs>

  <rect class="bg" width="900" height="260" rx="10"/>

  <text class="mono" x="20" y="30"><tspan class="prompt">manas@devbox:~$</tspan> <tspan class="cmd">whoami</tspan></text>
  <text class="mono out" x="20" y="55">Data Engineering Enthusiast &#8226; AI Builder &#8226; Problem Solver</text>

  <text class="mono" x="20" y="100"><tspan class="prompt">manas@devbox:~$</tspan> <tspan class="cmd">cat focus.txt</tspan></text>
  <text class="mono arrow" x="20" y="125">&gt; hybrid retrieval systems (dense + BM25 + reranking)</text>
  <text class="mono arrow" x="20" y="150">&gt; behavioral anomaly detection with auditable outputs</text>
  <text class="mono arrow" x="20" y="175">&gt; uncertainty-aware forecasting and signal interpretation</text>

  <text class="mono" x="20" y="220"><tspan class="prompt">manas@devbox:~$</tspan> <tspan class="cmd">echo $STATUS</tspan></text>
  <text class="mono out" x="20" y="245">open_to_collab=true</text>
</svg>
